# kitty config 
# kitty +kitten themes  # 打开kitty自带的配色主题选择界面
# kitty list-fonts --psnames  # 打开kitty字体

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# shell
#shell /opt/homebrew/bin/fish     # in MacOS

# cursor
cursor_shape          block
shell_integration     no-cursor
cursor_tail           6

# font
font-size 24
font-family           Maple Mono NF CN ExtraLight
bold-font             Maple Mono NF CN Bold
italic-font           Maple Mono NF CN Italic
bold_italic_font      Maple Mono NF CN Bold Italic
font_features         MapleMono-NF-CN-ExtraLight +cv01 +ss02 +ss04 +ss05 +zero
font_features         MapleMono-NF-CN-Bold +cv01 +ss02 +ss04 +ss05 +zero
font_features         MapleMono-NF-CN-Italic +cv01 +ss02 +ss04 +ss05 +zero
font_features         MapleMono-NF-CN-BoldItalic +cv01 +ss02 +ss04 +ss05 +zero

# window
hide_window_decorations      titlebar-only
window_padding_width         15
background_opacity           0.8
background_blur              30
remember_window_size         yes

# tab bar
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted

# MacOS related key mapping
#macos_option_as_alt yes


# MacOS vim key mapping
